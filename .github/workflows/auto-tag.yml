name: Auto-tag on master

on:
  push:
    branches: [master]
  pull_request:
    paths: ['.github/workflows/auto-tag.yml']

permissions:
  contents: write

# Avoid concurrent tag races when multiple pushes land in quick succession.
concurrency:
  group: auto-tag-master
  cancel-in-progress: false

jobs:
  tag:
    # Skip when:
    #  - the push was created by github-actions itself (avoid loops)
    #  - the commit message contains [skip-release] (manual opt-out)
    #  - the commit is a version-bump commit (publish-stable historic compat
    #    — should not happen anymore but kept as belt-and-braces)
    if: >-
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip-release]') &&
      !contains(github.event.head_commit.message, '[skip ci]') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use RELEASE_PAT so the resulting tag push re-triggers release.yml
          # (tags created by GITHUB_TOKEN do NOT trigger other workflows).
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute next tag (v{YYYY}.{M}.{DNN})
        id: ver
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)
          DAY=$(date -u +%-d)
          DAY_PADDED=$(date -u +%d)
          PREFIX="v${YEAR}.${MONTH}.${DAY}"
          PREFIX_PADDED="v${YEAR}.${MONTH}.${DAY_PADDED}"

          git fetch --tags --quiet

          # Patch segment is {D}{NN} (= 100*D + NN): unpadded day (1..31) +
          # 2-digit zero-padded run number (01..99). Avoiding a leading zero on
          # days 1..9 keeps the git tag identical to the SemVer 2.0 version npm
          # publishes (e.g. v2026.9.703 -> 2026.9.703) while staying monotonic
          # across days (day 9 max 999 < day 10 min 1001). Also inspect historic
          # zero-padded day tags (v2026.9.0703) when picking NEXT_NN.
          MAX_NN=$( {
                    git tag --list "${PREFIX}??" \
                      | grep -E "^${PREFIX}[0-9]{2}$" \
                      | sed -E "s|^${PREFIX}||" || true
                    git tag --list "${PREFIX_PADDED}??" \
                      | grep -E "^${PREFIX_PADDED}[0-9]{2}$" \
                      | sed -E "s|^${PREFIX_PADDED}||" || true
                  } | sort -n | tail -1 || true)
          NEXT_NN=$(printf '%02d' $(( 10#${MAX_NN:-0} + 1 )))
          TAG="${PREFIX}${NEXT_NN}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Next tag: ${TAG}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "Auto-tag from master @ ${GITHUB_SHA::7}"
          git push origin "${TAG}"

      - name: Summary
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          echo "## Tagged \`${TAG}\` :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Downstream release pipeline (release.yml on \`v*\` tags) will build binaries + publish npm." >> "$GITHUB_STEP_SUMMARY"

  # ── Regression test: tag computation must produce valid semver ──────────
  # Reproduces the bug fixed in #212 where the old v{YYYY}.{M}.{D}.{N}
  # scheme produced 4-segment tags (e.g. v2026.5.30.3) that npm coerced
  # into invalid prerelease versions, causing publish 404s.
  test-tag-scheme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Regression: broken tag v2026.5.30.3 must not poison next tag"
        run: |
          set -euo pipefail

          # Set up a throw-away repo with the known-broken tag
          tmp=$(mktemp -d)
          git init "$tmp/repo"
          cd "$tmp/repo"
          git config user.name "test"
          git config user.email "test@test"
          git commit --allow-empty -m "seed"

          # The original broken tag (4-segment, invalid semver) — #212
          git tag v2026.5.30.3
          # A valid tag produced after the fix
          git tag v2026.5.3001

          # ── Run the CURRENT computation logic (mirrors the 'ver' step) ──
          YEAR=2026; MONTH=5; DAY=30
          PREFIX="v${YEAR}.${MONTH}.${DAY}"

          MAX_NN=$(git tag --list "${PREFIX}??" \
                  | grep -E "^${PREFIX}[0-9]{2}$" \
                  | sed -E "s|^${PREFIX}||" \
                  | sort -n \
                  | tail -1 || true)
          NEXT_NN=$(printf '%02d' $(( 10#${MAX_NN:-0} + 1 )))
          TAG="${PREFIX}${NEXT_NN}"

          echo "Computed tag: ${TAG}"

          # ── Assertions ──

          # 1) Must be valid 3-segment semver (MAJOR.MINOR.PATCH)
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "FAIL: tag is not valid 3-segment semver: ${TAG}"
            exit 1
          fi
          echo "PASS: valid 3-segment semver"

          # 2) Must NOT reproduce the broken v2026.5.30.X scheme
          if [[ "$TAG" == v2026.5.30.* ]]; then
            echo "FAIL: tag uses broken dot-separated day scheme: ${TAG}"
            exit 1
          fi
          echo "PASS: no dot-separated day"

          # 3) Expected value: v2026.5.3002 (next after existing v2026.5.3001)
          if [[ "$TAG" != "v2026.5.3002" ]]; then
            echo "FAIL: expected v2026.5.3002, got ${TAG}"
            exit 1
          fi
          echo "PASS: correctly incremented to v2026.5.3002"

          # 4) npm must accept the version string verbatim (no leading zeros)
          node -e "
            const v = '${TAG#v}';
            const parts = v.split('.');
            if (parts.length !== 3) process.exit(1);
            if (parts.some(p => !/^(0|[1-9]\\d*)$/.test(p))) process.exit(1);
            console.log('PASS: npm-compatible semver:', v);
          "

          # 5) Single-digit day (e.g. day 7) must NOT have a leading zero in
          #    patch and must still increment past historic zero-padded tags.
          git tag v2026.9.0703
          YEAR=2026; MONTH=9; DAY=7; DAY_PADDED=07
          PREFIX="v${YEAR}.${MONTH}.${DAY}"
          PREFIX_PADDED="v${YEAR}.${MONTH}.${DAY_PADDED}"
          MAX_NN=$( {
                    git tag --list "${PREFIX}??" \
                      | grep -E "^${PREFIX}[0-9]{2}$" \
                      | sed -E "s|^${PREFIX}||" || true
                    git tag --list "${PREFIX_PADDED}??" \
                      | grep -E "^${PREFIX_PADDED}[0-9]{2}$" \
                      | sed -E "s|^${PREFIX_PADDED}||" || true
                  } | sort -n | tail -1 || true)
          NEXT_NN=$(printf '%02d' $(( 10#${MAX_NN:-0} + 1 )))
          TAG_SINGLE="${PREFIX}${NEXT_NN}"
          if [[ "$TAG_SINGLE" != "v2026.9.704" ]]; then
            echo "FAIL: expected v2026.9.704, got ${TAG_SINGLE}"
            exit 1
          fi
          echo "PASS: single-digit day produced SemVer-exact ${TAG_SINGLE}"

          rm -rf "$tmp"
