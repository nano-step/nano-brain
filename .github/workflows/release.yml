name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          # Windows binaries carry the .exe extension so the GitHub release
          # asset filename matches what npm/postinstall.js downloads into
          # binaryPath()'s nano-brain.exe slot (#637).
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        # Env vars live in `env:` (not as command-prefix `VAR=value`) so the
        # step works on every runner shell — bash/zsh on Linux/macOS and
        # PowerShell 7 on windows-latest. PowerShell doesn't recognize
        # bash-style `FOO=bar command` syntax and rejects the prefix
        # (`The term 'CGO_ENABLED=0' is not recognized…`), which made the
        # matrix windows entries added in #638 fail with exit 1 (#638
        # follow-up).
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/nano-brain

      - uses: actions/upload-artifact@v4
        with:
          name: nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: cd artifacts && sha256sum nano-brain-* > SHA256SUMS

      # Publish install.sh as a release asset too, so both the master raw URL
      # and releases/latest/download/install.sh resolve to a working installer.
      - name: Stage installer
        run: cp install.sh artifacts/install.sh

      - name: Create Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pinned to v4 — v5 breaks classic NPM_TOKEN publish with misleading 404
      # via npm 11.x OIDC auto-detection (actions/setup-node#1551, npm/cli#8730).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "${{ github.ref_name }}" == *"-beta"* || "${{ github.ref_name }}" == *"-alpha"* || "${{ github.ref_name }}" == *"-rc"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set version from git tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Publish @nano-step/nano-brain
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish nano-brain (unscoped alias)
        run: |
          node -e "const p=require('./package.json'); p.name='nano-brain'; delete p.publishConfig; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm publish --tag ${{ steps.npm-tag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
