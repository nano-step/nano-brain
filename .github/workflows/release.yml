name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish to npm (e.g. v2026.9.0703)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          # Windows binaries carry the .exe extension so the GitHub release
          # asset filename matches what npm/postinstall.js downloads into
          # binaryPath()'s nano-brain.exe slot (#637).
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"

      # The tag name reaches shell scripts only through `env:`, never through
      # `${{ }}` inside `run:`, and must look like a release tag before
      # anything is built from it (#659). `shell: bash` because the default
      # shell on windows-latest is PowerShell.
      - name: Validate tag
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "ERROR: invalid tag '$VERSION' (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE)"
            exit 1
          fi

      - name: Build
        # Env vars live in `env:` (not as command-prefix `VAR=value`) so the
        # step works on every runner shell — bash/zsh on Linux/macOS and
        # PowerShell 7 on windows-latest. PowerShell doesn't recognize
        # bash-style `FOO=bar command` syntax and rejects the prefix
        # (`The term 'CGO_ENABLED=0' is not recognized…`), which made the
        # matrix windows entries added in #638 fail with exit 1 (#638
        # follow-up). `shell: bash` so `${VERSION}` expands the same way on
        # all three runner OSes (#659).
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: go build -ldflags="-s -w -X main.Version=${VERSION}" -o nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/nano-brain

      - uses: actions/upload-artifact@v4
        with:
          name: nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          path: nano-brain-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA-256 checksums
        run: cd artifacts && sha256sum nano-brain-* > SHA256SUMS

      # Publish install.sh as a release asset too, so both the master raw URL
      # and releases/latest/download/install.sh resolve to a working installer.
      - name: Stage installer
        run: cp install.sh artifacts/install.sh

      - name: Create Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true

  # @nano-step/nano-brain's Trusted Publisher on npmjs.com has no environment
  # configured, whereas unscoped `nano-brain`'s Trusted Publisher is bound to
  # GitHub Actions environment `release`. Splitting into two jobs matches each
  # package's exact OIDC `sub`/`environment` claims independently.
  npm-publish-scoped:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Prepare OIDC Trusted Publishing
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is unset (missing id-token: write permission)"
            exit 1
          fi
          NPMRC="${NPM_CONFIG_USERCONFIG:-$(npm config get userconfig)}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
          fi
          node -e 'const [maj,min,pat]=process.argv[1].split(".").map(Number); process.exit(maj>11||(maj===11&&(min>5||(min===5&&pat>=1)))?0:1)' "$(npm -v)" \
            || npm install -g npm@^11.6.2
          echo "node=$(node -v) npm=$(npm -v)"

      - name: Determine npm tag and version
        id: npm-tag
        env:
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "ERROR: invalid tag '$TARGET_TAG' (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE)"
            exit 1
          fi
          if [[ "$TARGET_TAG" == *"-beta"* || "$TARGET_TAG" == *"-alpha"* || "$TARGET_TAG" == *"-rc"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          npm version --no-git-tag-version "${TARGET_TAG#v}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A manual (workflow_dispatch) publish skips the `release` job, so nothing
      # here has produced checksums. npm/postinstall.js refuses to install a
      # binary it cannot verify, so publishing a version whose GitHub release
      # has no SHA256SUMS would break every install of it (#676).
      - name: Require SHA256SUMS on the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -qx SHA256SUMS <<<"$assets"; then
            echo "ERROR: GitHub release '$TARGET_TAG' has no SHA256SUMS asset; refusing to publish to npm"
            exit 1
          fi

      - name: Publish @nano-step/nano-brain
        env:
          VER: ${{ steps.npm-tag.outputs.version }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: |
          unset NODE_AUTH_TOKEN
          if npm view "@nano-step/nano-brain@${VER}" version >/dev/null 2>&1; then
            echo "@nano-step/nano-brain@${VER} already published; skipping."
            exit 0
          fi
          npm publish --tag "$NPM_TAG" --access public

  npm-publish-unscoped:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Prepare OIDC Trusted Publishing
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is unset (missing id-token: write permission)"
            exit 1
          fi
          NPMRC="${NPM_CONFIG_USERCONFIG:-$(npm config get userconfig)}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
          fi
          node -e 'const [maj,min,pat]=process.argv[1].split(".").map(Number); process.exit(maj>11||(maj===11&&(min>5||(min===5&&pat>=1)))?0:1)' "$(npm -v)" \
            || npm install -g npm@^11.6.2
          echo "node=$(node -v) npm=$(npm -v)"

      - name: Determine npm tag and version
        id: npm-tag
        env:
          TARGET_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "ERROR: invalid tag '$TARGET_TAG' (expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE)"
            exit 1
          fi
          if [[ "$TARGET_TAG" == *"-beta"* || "$TARGET_TAG" == *"-alpha"* || "$TARGET_TAG" == *"-rc"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          npm version --no-git-tag-version "${TARGET_TAG#v}"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A manual (workflow_dispatch) publish skips the `release` job, so nothing
      # here has produced checksums. npm/postinstall.js refuses to install a
      # binary it cannot verify, so publishing a version whose GitHub release
      # has no SHA256SUMS would break every install of it (#676).
      - name: Require SHA256SUMS on the GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if ! grep -qx SHA256SUMS <<<"$assets"; then
            echo "ERROR: GitHub release '$TARGET_TAG' has no SHA256SUMS asset; refusing to publish to npm"
            exit 1
          fi

      - name: Publish nano-brain (unscoped alias)
        env:
          VER: ${{ steps.npm-tag.outputs.version }}
          NPM_TAG: ${{ steps.npm-tag.outputs.tag }}
        run: |
          unset NODE_AUTH_TOKEN
          if npm view "nano-brain@${VER}" version >/dev/null 2>&1; then
            echo "nano-brain@${VER} already published; skipping."
            exit 0
          fi
          node -e "const p=require('./package.json'); p.name='nano-brain'; delete p.publishConfig; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm publish --tag "$NPM_TAG" --access public
