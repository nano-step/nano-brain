database:
  url: "postgres://nanobrain:nanobrain@host.docker.internal:5432/nanobrain_test?sslmode=disable"

server:
  host: "localhost"
  port: 3199

embedding:
  provider: "ollama"
  url: "http://host.docker.internal:11434"
  model: "nomic-embed-text"

# Disabled so a test server does not call the provider without credentials.
# To exercise code summarization, set enabled: true locally (do not commit it)
# and export NANO_BRAIN_CODE_SUMMARIZE_API_KEY. Never put the key in this file.
code_summarization:
  enabled: false
  provider_url: "https://ai-proxy.thnkandgrow.com/v1"
  model: "nano-brain"
  batch_size: 20
  concurrency: 2
  max_symbol_lines: 500
  request_timeout: 600

flow:
  enabled: true
