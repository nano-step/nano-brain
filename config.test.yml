database:
  url: "postgres://nanobrain:nanobrain@host.docker.internal:5432/nanobrain_test?sslmode=disable"

server:
  host: "localhost"
  port: 3199

embedding:
  provider: "ollama"
  url: "http://host.docker.internal:11434"
  model: "nomic-embed-text"

# The API key is not stored here: export NANO_BRAIN_CODE_SUMMARIZE_API_KEY
# before starting a test server. Without it, code summarization calls fail
# with an auth error and symbols stay unsummarized.
code_summarization:
  enabled: true
  provider_url: "https://ai-proxy.thnkandgrow.com/v1"
  model: "nano-brain"
  batch_size: 20
  concurrency: 2
  max_symbol_lines: 500
  request_timeout: 600

flow:
  enabled: true
