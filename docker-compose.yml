services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nanobrain-pg
    environment:
      POSTGRES_USER: nanobrain
      POSTGRES_PASSWORD: nanobrain
      POSTGRES_DB: nanobrain_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nanobrain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobrain -d nanobrain_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: nanobrain-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - nanobrain-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3

  nano-brain:
    build: .
    container_name: nanobrain
    # The daemon must listen on 0.0.0.0 inside the container to be reachable
    # through the published port, and it runs without auth. The port is
    # published on the host's loopback only, so the API is reachable by
    # processes on this machine and by containers on this compose network,
    # and by nothing else. To expose nano-brain beyond this machine, configure
    # server.auth and remove --unsafe-no-auth instead of widening the binding.
    #
    # Linux: a container outside this compose network cannot reach a
    # loopback-published port through host.docker.internal (it resolves to the
    # bridge gateway). Attach that container to this network and use the
    # service name, or add a second publish on the bridge gateway address in a
    # docker-compose.override.yml together with server.auth.
    command: ["serve", "--unsafe-no-auth"]
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      NANO_BRAIN_SERVER_HOST: "0.0.0.0"
      # Names this container answers to. Without auth the daemon rejects any
      # other Host header, so a container reaching it by service or container
      # name must be listed here.
      NANO_BRAIN_SERVER_ALLOWED_HOSTS: "localhost,127.0.0.1,::1,host.docker.internal,nano-brain,nanobrain"
      NANO_BRAIN_DATABASE_URL: "postgres://nanobrain:nanobrain@postgres:5432/nanobrain_dev"
      NANO_BRAIN_EMBEDDING_URL: "http://ollama:11434"
      NANO_BRAIN_EMBEDDING_PROVIDER: ollama
      NANO_BRAIN_EMBEDDING_MODEL: nomic-embed-text
    restart: unless-stopped

volumes:
  nanobrain-pgdata:
  nanobrain-ollama:
