services:
  nano-brain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nanobrain-app
    # The daemon must listen on 0.0.0.0 inside the container to be reachable
    # through the published port, and it runs without auth. The port is
    # published on the host's loopback only, so the API is reachable by
    # processes on this machine and by containers on this compose network,
    # and by nothing else. To expose nano-brain beyond this machine, configure
    # server.auth and remove --unsafe-no-auth instead of widening the binding.
    #
    # Linux: a container outside this compose network cannot reach a
    # loopback-published port through host.docker.internal (it resolves to the
    # bridge gateway). Attach that container to this network and use the
    # service name, or add a second publish on the bridge gateway address in a
    # docker-compose.override.yml together with server.auth.
    command: ["serve", "--unsafe-no-auth"]
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      DATABASE_URL: "postgres://nanobrain:nanobrain@postgres:5432/nanobrain_dev?sslmode=disable"
      NANO_BRAIN_SERVER_HOST: "0.0.0.0"
      NANO_BRAIN_SERVER_PORT: "3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nano-brain", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: nanobrain-pg
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: nanobrain
      POSTGRES_PASSWORD: nanobrain
      POSTGRES_DB: nanobrain_dev
    volumes:
      - nanobrain_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanobrain -d nanobrain_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nanobrain_pgdata:
